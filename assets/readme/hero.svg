<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">InFish Download — verified media from a URL</title>
  <desc id="desc">A terminal-inspired flow from a public URL through platform extraction to a verified local media file.</desc>
  <defs>
    <linearGradient id="flow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7DE2D1"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7F7F0" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#0B1220"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M58 40H1142" stroke="#7DE2D1" stroke-opacity=".25"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="60" y="82" fill="#7DE2D1" font-size="18" font-weight="700" letter-spacing="3">AGENT MEDIA TOOLKIT</text>
    <text x="60" y="145" fill="#F5FAFA" font-size="54" font-weight="750">InFish Download</text>
    <text x="60" y="188" fill="#C7D4D8" font-size="25">From a public URL to a verified local file.</text>
    <text x="60" y="238" fill="#80909F" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">VIDEO  /  AUDIO  /  SUBTITLES  /  METADATA</text>
    <rect x="60" y="274" width="246" height="42" rx="21" fill="#142638" stroke="#7DE2D1" stroke-opacity=".45"/>
    <text x="84" y="301" fill="#F5FAFA" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">download this + URL</text>
  </g>
  <g transform="translate(610 66)">
    <rect x="0" y="0" width="530" height="238" rx="20" fill="#101D2D" stroke="#2D485C"/>
    <text x="28" y="38" fill="#80909F" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">$ infish resolve --verify</text>
    <rect x="28" y="60" width="474" height="42" rx="10" fill="#0B1220" stroke="#36566A"/>
    <circle cx="51" cy="81" r="7" fill="#7DE2D1"/>
    <text x="70" y="87" fill="#DCE9EA" font-size="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">https://x.com/user/status/123</text>
    <path d="M66 132H454" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M148 132l-12-8v16zM292 132l-12-8v16zM436 132l-12-8v16z" fill="#FFB86B"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" text-anchor="middle">
      <circle cx="66" cy="132" r="22" fill="#183B43" stroke="#7DE2D1" stroke-width="2"/>
      <text x="66" y="138" fill="#F5FAFA" font-size="16" font-weight="700">URL</text>
      <circle cx="210" cy="132" r="22" fill="#273C3B" stroke="#7DE2D1" stroke-width="2"/>
      <text x="210" y="138" fill="#F5FAFA" font-size="16" font-weight="700">EXTRACT</text>
      <circle cx="354" cy="132" r="22" fill="#443B2E" stroke="#FFB86B" stroke-width="2"/>
      <text x="354" y="138" fill="#F5FAFA" font-size="16" font-weight="700">MEDIA</text>
      <circle cx="498" cy="132" r="22" fill="#443B2E" stroke="#FFB86B" stroke-width="2"/>
      <text x="498" y="138" fill="#F5FAFA" font-size="16" font-weight="700">OK</text>
    </g>
    <text x="28" y="193" fill="#7DE2D1" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ffprobe  ✓  h264  ·  1080×1080  ·  8.0s</text>
    <text x="28" y="220" fill="#80909F" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">absolute path  →  ~/Downloads</text>
  </g>
</svg>
